[workspace]
resolver = "2"
members = ["packages/sdkwork-utils-rust"]

[workspace.package]
rust-version = "1.85"
edition = "2021"
version = "0.11.0"
license = "AGPL-3.0-or-later"
authors = ["SDKWork"]
repository = "https://github.com/sdkwork/sdkwork-utils"
description = "SDKWork cross-language utility libraries"

[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
